[build]
  command = "npm install"
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Stripe webhooks need the raw body for signature verification
[functions."stripe-webhook"]
  included_files = []

# One-time balance charges for deposit_paid rows when camp is ≤7 days out.
# Failures become charge_failed and are never retried (query is deposit_paid only).
# Requires a Netlify plan that supports Scheduled Functions (Pro+).
[functions."charge-remaining-balance"]
  schedule = "@daily"

# Legacy alias only — do NOT schedule (would double-charge). Handled by charge-remaining-balance.

# sharp is a native module — keep it external for Netlify bundling
[functions."approve-instagram-story"]
  external_node_modules = ["sharp"]

# Email nomination invitation graphics 3 hours after submit.
# Requires Netlify scheduled functions (Pro+) plus RESEND_API_KEY or SENDGRID_API_KEY.
[functions."send-nomination-invites"]
  schedule = "*/15 * * * *"
  external_node_modules = ["sharp"]
  included_files = ["assets/invite-template.png"]
